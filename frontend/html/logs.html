<!DOCTYPE html>
<html lang="en" data-theme="dark">

<!--
  Every alert one well has ever raised.

  Opened from the dashboard as /logs.html?well=<database_name>, and it stands
  on its own from there: it reads the well out of its own query string, fetches
  its own alerts and polls for more. That is what makes it survive a refresh -
  the page used to be written into this tab by the dashboard, so reloading it
  asked the server for a file that rendered nothing.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alert Log</title>
    <link rel="stylesheet" href="../css/logs.css">
    <link rel="icon" href="../images/logo-default-223x59.png">
</head>

<body>
    <header>
        <div class="title-row">
            <h1><span id="well-name">Loading…</span></h1>
            <span class="note">(Showing alerts from the last 24 hours)</span>
        </div>

        <div class="toolbar">
            <input id="filter" type="text" placeholder="HH:MM:SS">
            <span class="chip" data-tone="critical">Critical</span>
            <!-- <span class="chip" data-tone="warn">Warning</span> -->
            <span class="chip" data-tone="info">Warning</span>
        </div>
    </header>

    <main id="list"></main>

    <script src="../js/shared.js"></script>
    <script src="../js/logs.js"></script>
</body>

</html>
