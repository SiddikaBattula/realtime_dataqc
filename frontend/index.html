<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RealTime DataQC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo-default-223x59.png">
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <img class="brand-logo" src="logo-default-223x59.png" alt="OFI India" width="896" height="1153">
            <span class="brand-text">RealTime DataQC</span>
        </div>

        <div class="topbar-right">
            <div class="link-state" id="link-state" data-state="connecting">
                <span class="link-dot"></span>
                <span id="link-text">Connecting</span>
            </div>

            <button class="btn" id="settings-open" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9.5a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
                </svg>
                Settings
            </button>
        </div>
    </header>

    <main class="wrap">
        <div class="summary">
            <span><b id="stat-wells">0</b> wells monitored</span>
            <i class="summary-sep"></i>
            <span><b id="stat-alerts">0</b> active alerts</span>
            <i class="summary-sep"></i>
            <span class="summary-faint" id="stat-updated">—</span>
        </div>

        <section class="grid" id="grid"></section>

        <div class="empty" id="empty">
            <svg class="empty-mark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2 4 7v10l8 5 8-5V7z" />
            </svg>
            <h2>No wells being monitored</h2>
            <p>Open <b>Settings</b> and add a well by its database name and IP address.</p>
            <button class="btn btn-primary" type="button" data-open-settings>Add the first well</button>
        </div>
    </main>

    <!-- One well card -->
    <template id="tpl-well">
        <article class="well">
            <header class="well-head">
                <span class="well-dot"></span>
                <h2 class="well-name"></h2>
                <span class="well-count"></span>
                <button class="well-remove" type="button" title="Stop monitoring this well">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </header>

            <ul class="alerts"></ul>

            <div class="well-blank">
                <span class="well-blank-text"></span>
            </div>

            <!-- Drag to resize; double-click any of them to go back to default. -->
            <span class="well-grip" data-dir="e" title="Drag to widen"></span>
            <span class="well-grip" data-dir="s" title="Drag to make taller"></span>
            <span class="well-grip" data-dir="se" title="Drag to resize"></span>
        </article>
    </template>

    <!-- One grouped alert -->
    <template id="tpl-alert">
        <li class="alert">
            <time class="alert-time"></time>
            <span class="alert-msg"></span>
            <span class="alert-repeat"></span>
        </li>
    </template>

    <!-- Settings -->
    <div class="modal" id="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <header class="modal-head">
                <h2 id="modal-title">Add a well</h2>
                <button class="icon-btn" id="settings-close" type="button" aria-label="Close">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </header>

            <form class="modal-form" id="add-well-form" autocomplete="off">
                <label class="field">
                    <span>Database name</span>
                    <input type="text" id="database_name" placeholder="kj-16" required spellcheck="false">
                </label>

                <label class="field">
                    <span>IP address</span>
                    <input type="text" id="ip_address" placeholder="10.0.0.5" required spellcheck="false">
                </label>

                <p class="field-note">
                    The agent connects within about five seconds and alerts appear on its card.
                </p>

                <button class="btn btn-primary btn-block" type="submit" id="add-submit">Start monitoring</button>
            </form>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="app.js"></script>
</body>

</html>
