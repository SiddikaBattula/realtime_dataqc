<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Real-Time Data QC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo-default-223x59.png">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login">
        <!-- Sign in -->
        <form class="login-card" id="login-form" autocomplete="off">
            <img src="logo-default-223x59.png" alt="OFI India">
            <h1>Real-Time Data QC</h1>

            <label class="field">
                <span>Email</span>
                <input type="email" id="email" placeholder="name@ofiindia.com" required autofocus>
            </label>

            <label class="field">
                <span>Password</span>
                <input id="password" required data-secret>
            </label>

            <p class="modal-error" id="error" hidden></p>
            <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
        </form>
    </main>

    <script src="secret-input.js"></script>
    <script src="login.js"></script>
</body>

</html>
