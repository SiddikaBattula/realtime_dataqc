[project]
name = "realtime-dataqc"
version = "0.1.0"
description = "Realtime data-quality checks on drilling rig telemetry, one agent per well."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
realtime-dataqc = "main:main"
